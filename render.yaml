services:
  # Backend Flask REST API Web Service (Free Tier)
  - type: web
    name: myboard-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: myboard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

  # Frontend Static Site (Free Tier)
  - type: static_site
    name: myboard-app
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: myboard-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # Free PostgreSQL Database
  - name: myboard-db
    region: oregon
    plan: free
    databaseName: myboard
    user: myboard_admin
