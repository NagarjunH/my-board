version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: myboard-postgres
    restart: always
    environment:
      POSTGRES_DB: myboard
      POSTGRES_USER: myboard_user
      POSTGRES_PASSWORD: myboard_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myboard-backend
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://myboard_user:myboard_secure_password_2026@postgres:5432/myboard
      SECRET_KEY: dev-secret-key-change-in-production
      JWT_SECRET_KEY: dev-jwt-key-change-in-production
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myboard-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
